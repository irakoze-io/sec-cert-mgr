## Logging
logging.level.root=INFO
logging.level.org.hibernate.SQL=ERROR
logging.level.liquibase=TRACE
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=ERROR
logging.level.org.hibernate.orm.jdbc.bind=ERROR
### Logging with date-based rolling file
logging.pattern.dateformat=yyyy-MM-dd HH:mm:ss.SSS
logging.file.name=logs/sec-cert-mgr.log
logging.file.path=logs
logging.logback.rollingpolicy.file-name-pattern=logs/sec-cert-mgr-%d{yyyy-MM-dd}.%i.log
logging.logback.rollingpolicy.max-history=30
logging.logback.rollingpolicy.total-size-cap=1GB
logging.pattern.console=%clr(%d{HH:mm:ss}){faint} %clr(%-5level){highlight} %clr(%logger{20}){cyan} - %msg%n
logging.pattern.file=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n