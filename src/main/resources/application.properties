spring.threads.virtual.enabled=true
spring.docker.compose.enabled=true

spring.application.name=sec-cert-mgr
spring.application.version=2.1.0
spring.application.base-url=http://localhost:8080

## Application Database Properties
spring.datasource.url=jdbc:postgresql://localhost:5432/sec_cert_mgr
spring.datasource.username=root
spring.datasource.password=runPQSQLN0w
spring.datasource.driver-class-name=org.postgresql.Driver

### JPA Properties
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.multiTenancy=SCHEMA
spring.jpa.properties.hibernate.temp.use_jdbc_metadata_defaults=false
spring.jpa.properties.hibernate.jdbc.batch_size=20
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.use_sql_comments=true
spring.jpa.properties.hibernate.generate_statistics=true
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# OpenAPI/Swagger
springdoc.enable-spring-security=false
springdoc.api-docs.path=/v${spring.application.version}/api-docs

# Storage - MinIO/S3
storage.minio.endpoint=http://localhost:9000
storage.minio.access-key=root
storage.minio.secret-key=runMinION0w
storage.minio.bucket-name=${spring.application.name:app}
storage.minio.signed-url-expiration-minutes=60
storage.minio.secure=false

# RabbitMQ
spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.username=root
spring.rabbitmq.password=runRMQN0w
spring.rabbitmq.virtual-host=/
spring.rabbitmq.listener.simple.acknowledge-mode=manual
spring.rabbitmq.listener.simple.retry.enabled=true
spring.rabbitmq.listener.simple.retry.initial-interval=1000
spring.rabbitmq.listener.simple.retry.max-retries=3
spring.rabbitmq.listener.simple.retry.multiplier=2.0
spring.rabbitmq.listener.simple.retry.max-interval=10000
spring.rabbitmq.publisher-confirm-type=correlated
spring.rabbitmq.publisher-returns=true

